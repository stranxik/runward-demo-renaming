# Two jobs on purpose: the whole demonstration is the gap between them. `tests` says the code works;
# `gate` says whether the delivery record still describes the code.
# Actions are pinned by commit; permissions are the least each job needs.
name: ci
on:
  push:
  workflow_dispatch:
permissions: {}
concurrency: { group: "ci-${{ github.ref }}-${{ github.event_name }}", cancel-in-progress: false }
jobs:
  tests:
    name: tests (the code works)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: "24" }
      - run: cd code && npm ci --no-audit --no-fund && npm test

  gate:
    name: runward gate (the delivery holds)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read }
    outputs:
      exit: ${{ steps.check.outputs.exit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: "24" }
      - name: install runward 0.46.0, integrity checked, outside the tree, without scripts
        run: |
          mkdir -p "$RUNNER_TEMP/rw" && cd "$RUNNER_TEMP/rw"
          curl -sSfLo runward.tgz https://registry.npmjs.org/runward/-/runward-0.46.0.tgz
          echo "+O+Q8yVcdxCNm9bsb9IbrIcHU5SB90hgfReoHdKolzCwTvBggWn7DXDu6IAhX84bHQ8M6qJks6yU6DHbtFyLIQ==  runward.tgz" > want
          [ "$(openssl dgst -sha512 -binary runward.tgz | base64 -w0)  runward.tgz" = "$(cat want)" ] || { echo "runward tarball integrity mismatch"; exit 1; }
          npm install --ignore-scripts --no-audit --no-fund --prefix . ./runward.tgz >/dev/null
      - id: check
        name: runward check --strict (read it here; the same verdict is kept as check.json)
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/rw/node_modules/.bin/runward" check --strict --json > "$RUNNER_TEMP/out/check.json"
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/rw/node_modules/.bin/runward" check --strict
          echo "runward check: exit $code"
          exit 0
      - name: keep check.json (what runward wrote for this commit, refused or not)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: { name: check-json, path: "${{ runner.temp }}/out/check.json", if-no-files-found: error, retention-days: 90 }
      - name: runward's verdict, given back to the job
        env: { CODE: "${{ steps.check.outputs.exit }}" }
        run: exit "$CODE"

  page:
    # The static page runward-fleet builds from check.json, kept as a CI artifact and published nowhere.
    # runward-fleet is not on npm: it is taken from stranxik/runward at one pinned commit of main
    # (never a branch head), and the job checks that this is the commit it got.
    name: static page (CI artifact, published nowhere)
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'success' || needs.gate.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read }
    env:
      FLEET_COMMIT: 5a9cdf08a76977f9b671662f562e98d332ccc95e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false, path: demo }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: stranxik/runward
          ref: 5a9cdf08a76977f9b671662f562e98d332ccc95e
          sparse-checkout: packages/runward-fleet
          persist-credentials: false
          path: runward-src
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: "24" }
      - name: runward-fleet is the code at the pinned commit
        run: '[ "$(git -C runward-src rev-parse HEAD)" = "$FLEET_COMMIT" ] || { echo "runward-src is not at $FLEET_COMMIT"; exit 1; }'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: check-json, path: "${{ runner.temp }}/fleet/exports" }
      - name: build the page (the date on it is the commit's date, declared; nothing reads a clock)
        env: { SHA: "${{ github.sha }}", REPO: "${{ github.repository }}" }
        run: |
          cd "$RUNNER_TEMP/fleet"
          AS_OF=$(git -C "$GITHUB_WORKSPACE/demo" show -s --format=%cs "$SHA")
          cat > fleet.json <<JSON
          {
            "format": "runward-fleet-manifest/0",
            "title": "runward-demo-renaming",
            "asOf": "$AS_OF",
            "lang": "en",
            "missions": [
              {
                "id": "runward-demo-renaming",
                "name": "$REPO",
                "repository": "github.com/$REPO",
                "commit": "$SHA",
                "commitSource": "GITHUB_SHA of the CI run that wrote check.json",
                "expects": ["check"],
                "exports": { "check": { "file": "exports/check.json", "producedBy": "runward check --strict --json" } }
              }
            ]
          }
          JSON
          node "$GITHUB_WORKSPACE/runward-src/packages/runward-fleet/src/cli.js" build fleet.json --out site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: { name: static-page, path: "${{ runner.temp }}/fleet/site", if-no-files-found: error, retention-days: 90 }

  send:
    # Wired, and on when the repository variable RUNWARD_HOSTED_SEND is "on" (see README, "Sending the
    # check to runward hosted"). The commit below is the send workflow the hosted service accepts today
    # (its /api/version names it under sendWorkflow). send.yml accepts runward 0.46.0 only, and sends only
    # on a push to main.
    if: ${{ vars.RUNWARD_HOSTED_SEND == 'on' }}
    permissions: { contents: read, id-token: write }
    uses: stranxik/runward-hosted/.github/workflows/send.yml@f70f2705cd416e38389e6c0a5c8be9f002179f8b
    with: { mission: runward-demo-renaming }
